name: Update GitHub stats

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "21 16 * * *"

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate stats cards
        env:
          GITHUB_USERNAME: michaeld3n
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/generate_github_stats.py

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-languages.svg assets/github-contributions.svg
          git diff --cached --quiet || git commit -m "Update generated GitHub stats"
          git push
