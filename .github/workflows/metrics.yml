name: Metrics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 16 * * *"
  push:
    branches:
      - main
    paths-ignore:
      - "assets/metrics-*.svg"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: michaeld3n
          filename: assets/metrics-overview.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Australia/Sydney

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: michaeld3n
          filename: assets/metrics-languages.svg
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          config_timezone: Australia/Sydney

      - name: Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_STATS_TOKEN }}
          user: michaeld3n
          filename: assets/metrics-calendar.svg
          template: classic
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_calendar: yes
          plugin_calendar_limit: 1
          config_timezone: Australia/Sydney
